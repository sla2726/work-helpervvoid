<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORKSPACE</title>
<style>
:root{color-scheme:dark;--bg:#15171A;--panel:#202328;--sec:#282C32;--bd:#343940;--tx:#F0F0F0;--tx2:#969DA7;--ac:#B8BEC7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
.app{display:flex;min-height:100%}
aside{width:232px;background:var(--panel);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{font-weight:700;letter-spacing:.14em;font-size:13px;padding:6px 10px 18px;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;border-radius:2px;background:var(--ac)}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--tx2);text-decoration:none;transition:.15s}
nav a:hover{background:var(--sec);color:var(--tx)}
nav a.on{background:var(--sec);color:var(--tx);box-shadow:inset 2px 0 var(--ac)}
svg.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
main{flex:1;min-width:0;padding:28px;max-width:1100px;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
.sub{color:var(--tx2);margin-bottom:22px;text-transform:capitalize}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--tx2);display:flex;justify-content:space-between;align-items:center}
.big{font-size:26px;font-weight:600}
.lbl{color:var(--tx2);font-size:12px;margin-top:2px}
.two{grid-template-columns:2fr 1fr}
.bar{height:6px;background:var(--sec);border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .4s}
.goal{margin-bottom:14px}
.goal div.r{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.empty{color:var(--tx2);text-align:center;padding:26px 10px;border:1px dashed var(--bd);border-radius:8px;font-size:13px}
.empty svg{width:22px;height:22px;display:block;margin:0 auto 8px;opacity:.7}
button,input{font:inherit;color:var(--tx)}
.btn{background:var(--sec);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);color:#15171A;border-color:var(--ac);font-weight:600}
.gform{display:grid;gap:10px}
.gform label{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--tx2)}
input[type=number]{width:90px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.col span.b{width:100%;max-width:34px;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;transition:height .4s}
.col span.b.z{background:var(--sec)}
.col small{color:var(--tx2);font-size:11px}
.col em{font-style:normal;font-size:11px;color:var(--tx2)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--sec);border:1px solid var(--bd);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.md{width:100%;max-width:420px;max-height:90vh;overflow:auto;display:grid;gap:10px}.f{display:grid;gap:4px;color:var(--tx2);font-size:12px}.f input,.f select,.f textarea,select,textarea.bk{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;color:var(--tx);font:inherit;width:100%}select{width:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.item{padding:10px 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:11px;background:var(--sec);border:1px solid var(--bd);border-radius:6px;padding:2px 7px;color:var(--tx2)}.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.on.btn{border-color:var(--ac)}.late{color:#d38b8b}.mini{padding:4px 8px;font-size:12px}textarea.bk{height:150px;font-size:12px}.ring{display:block;margin:6px auto}.tm{font-size:44px;font-weight:600;text-align:center;margin-top:-132px;height:132px;line-height:132px}@media(max-width:800px){.kb{grid-template-columns:1fr}}
:root[data-theme=light]{color-scheme:light;--bg:#F4F5F7;--panel:#FFFFFF;--sec:#ECEEF1;--bd:#D5D9DF;--tx:#15171A;--tx2:#5E6670;--ac:#4A515C}[data-theme=light] .btn.p{color:#fff}
.top{display:none}
@media(max-width:800px){
 aside{position:fixed;z-index:5;left:0;top:0;transform:translateX(-100%);transition:.2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
 aside.open{transform:none}
 .top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
 main{padding:16px}.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<aside id="side"><div class="brand"><i></i>WORKSPACE</div><nav id="nav"></nav></aside>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const P={dash:"M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z",proj:"M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z",task:"M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11",focus:"M10 2h4M12 14l3-3M12 22a8 8 0 1 0 0-16 8 8 0 0 0 0 16z",goal:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",lib:"M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20",zap:"M13 2L3 14h9l-1 8 10-12h-9z",cfg:"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z",menu:"M4 6h16M4 12h16M4 18h16"};
const ic=k=>`<svg class="ic" viewBox="0 0 24 24"><path d="${P[k]}"/></svg>`;
const NAV=[["dash","Dashboard",1],["proj","Projetos",2],["task","Tarefas",2],["focus","Focus Room",3],["goal","Metas e hábitos",4],["lib","Biblioteca",4],["zap","Anti-procrastinação",4],["cfg","Configurações",5]];
const STORES=["projects","tasks","habits","sessions","notes"];
let db=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("workspace",1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s,{keyPath:"id"}));r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function all(s){return new Promise(res=>{if(!db)return res([]);try{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
const DG={minutes:300,sessions:10,deliveries:2};
function getGoals(){try{return{...DG,...JSON.parse(localStorage.getItem("ws_goals")||"{}")}}catch(e){return{...DG}}}
function setGoals(g){try{localStorage.setItem("ws_goals",JSON.stringify(g));return true}catch(e){return false}}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
function nav(){const h=location.hash.slice(1)||"dash";document.getElementById("nav").innerHTML=NAV.map(([k,n])=>`<a href="#${k}" class="${h===k?"on":""}">${ic(k)}${n}</a>`).join("");return h}
const empty=(k,t)=>`<div class="empty">${ic(k)}${t}</div>`;
async function dashboard(){
 const [pr,tk,se]=await Promise.all([all("projects"),all("tasks"),all("sessions")]);
 const g=getGoals(),ws=weekStart(),wt=ws.getTime(),we=wt+7*864e5;
 const wsess=se.filter(s=>s.startedAt>=wt&&s.startedAt<we);
 const mins=Math.round(wsess.reduce((a,s)=>a+(s.minutes||0),0));
 const nsess=wsess.filter(s=>s.completed).length;
 const active=pr.filter(p=>p.status==="em_andamento"&&!p.archived).length;
 const pend=tk.filter(t=>t.status!=="concluida");
 const deliv=pr.filter(p=>p.status==="concluido"&&p.completedAt>=wt&&p.completedAt<we).length;
 const days=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"],per=days.map(()=>0);
 wsess.forEach(s=>per[(new Date(s.startedAt).getDay()+6)%7]+=s.minutes||0);
 const mx=Math.max(...per,1);
 const pc=(v,m)=>Math.min(100,Math.round(v/m*100));
 const prog=Math.round((pc(mins,g.minutes)+pc(nsess,g.sessions)+pc(deliv,g.deliveries))/3);
 const h=new Date().getHours(),sd=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
 const date=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 const gl=(n,v,m,u)=>`<div class="goal"><div class="r"><span>${n}</span><span style="color:var(--tx2)">${v}/${m} ${u}</span></div><div class="bar"><b style="width:${pc(v,m)}%"></b></div></div>`;
 const next=pend.filter(t=>t.due).sort((a,b)=>a.due>b.due?1:-1).concat(pend.filter(t=>!t.due)).slice(0,5);
 document.getElementById("main").innerHTML=`
 <div class="top"><button class="btn" id="mb" aria-label="Menu">${ic("menu")}</button></div>
 <h1>${sd}</h1><div class="sub">${date}</div>
 <div class="grid stats">
  <div class="card"><div class="big">${mins}</div><div class="lbl">Minutos trabalhados</div></div>
  <div class="card"><div class="big">${nsess}</div><div class="lbl">Sessões de foco</div></div>
  <div class="card"><div class="big">${active}</div><div class="lbl">Projetos ativos</div></div>
  <div class="card"><div class="big">${pend.length}</div><div class="lbl">Tarefas pendentes</div></div>
 </div>
 <div class="grid two" style="margin-bottom:12px">
  <div class="card"><h3>Produtividade da semana <span>${mins} min</span></h3>
   <div class="chart">${per.map((v,i)=>`<div class="col"><em>${v||""}</em><span class="b ${v?"":"z"}" style="height:${Math.round(v/mx*100)}%"></span><small>${days[i]}</small></div>`).join("")}</div>
   ${mins?"":`<div class="lbl" style="margin-top:10px">As barras aparecem quando você registrar sessões de foco (Fase 3).</div>`}</div>
  <div class="card"><h3>Progresso da semana <span>${prog}%</span></h3><div class="bar" style="height:8px;margin-bottom:18px"><b style="width:${prog}%"></b></div>
   ${gl("Minutos",mins,g.minutes,"min")}${gl("Sessões",nsess,g.sessions,"")}${gl("Entregas",deliv,g.deliveries,"")}</div>
 </div>
 <div class="grid two">
  <div class="card"><h3>Próximas tarefas</h3>${next.length?next.map(t=>`<div style="padding:8px 0;border-top:1px solid var(--bd)">${String(t.title||"").replace(/</g,"&lt;")}<span class="lbl" style="float:right">${t.due||""}</span></div>`).join(""):empty("task","Nenhuma tarefa pendente. O gerenciador de tarefas chega na Fase 2.")}</div>
  <div class="card"><h3>Metas semanais</h3><form class="gform" id="gf">
   <label>Minutos por semana<input type="number" min="0" name="minutes" value="${g.minutes}"></label>
   <label>Sessões de foco<input type="number" min="0" name="sessions" value="${g.sessions}"></label>
   <label>Entregas concluídas<input type="number" min="0" name="deliveries" value="${g.deliveries}"></label>
   <button class="btn p" type="submit">Salvar metas</button></form></div>
 </div>`;
 document.getElementById("gf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),n={};for(const k of Object.keys(DG)){const v=parseInt(f.get(k),10);n[k]=v>=0?v:DG[k]}toast(setGoals(n)?"Metas salvas":"Não foi possível salvar");dashboard()};
}
function stub(k){const [,n,ph]=NAV.find(x=>x[0]===k);
 document.getElementById("main").innerHTML=`<div class="top"><button class="btn" id="mb" aria-label="Menu">${ic("menu")}</button></div><h1>${n}</h1><div class="sub">Em desenvolvimento</div>${empty(k,`Esta seção será construída na Fase ${ph}.`)}`}
const V=document.getElementById("main"),TOP=`<div class="top"><button class="btn" id="mb" aria-label="Menu">${ic("menu")}</button></div>`;
const IO=(s,f)=>new Promise(r=>{try{const t=db.transaction(s,"readwrite");f(t.objectStore(s));t.oncomplete=()=>r(1);t.onerror=()=>r(0)}catch(e){r(0)}});
const put=(s,o)=>IO(s,x=>x.put(o)),del=(s,id)=>IO(s,x=>x.delete(id)),clr=s=>IO(s,x=>x.clear());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ld=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ST={nao_iniciado:"Não iniciado",em_andamento:"Em andamento",pausado:"Pausado",concluido:"Concluído"},PR={alta:"Alta",media:"Média",baixa:"Baixa"},TS={a_fazer:"A fazer",fazendo:"Em andamento",concluida:"Concluída"};
const opts=o=>Object.entries(o),A={},F={};
V.onclick=e=>{if(e.target.closest("#mb"))document.getElementById("side").classList.toggle("open");const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id,b)};
V.onchange=e=>{const f=e.target.dataset.f;if(f&&F[f])F[f](e.target.value)};
function ask(m,fn){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="card md"><div>${esc(m)}</div><div class="row"><button class="btn" id="n">Cancelar</button><button class="btn p" id="y">Confirmar</button></div></div>`;document.body.append(o);o.querySelector("#n").onclick=()=>o.remove();o.querySelector("#y").onclick=async()=>{await fn();o.remove()}}
function modal(t,fs,v,ok){const o=document.createElement("div");o.className="ov";o.innerHTML=`<form class="card md"><h3>${t}</h3>${fs.map(([n,l,ty,op])=>`<label class="f">${l}${ty==="select"?`<select name="${n}">${op.map(([k,x])=>`<option value="${k}" ${v[n]===k?"selected":""}>${esc(x)}</option>`).join("")}</select>`:ty==="area"?`<textarea name="${n}" rows="3">${esc(v[n])}</textarea>`:`<input name="${n}" type="${ty}" value="${esc(v[n])}" ${n==="title"||n==="name"?"required":""}>`}</label>`).join("")}<div class="row"><button type="button" class="btn" id="cx">Cancelar</button><button class="btn p">Salvar</button></div></form>`;document.body.append(o);o.querySelector("#cx").onclick=()=>o.remove();o.querySelector("form").onsubmit=async e=>{e.preventDefault();await ok(Object.fromEntries(new FormData(e.target)));o.remove()}}
const sel=(f,o,v,a)=>`<select data-f="${f}"><option value="">${a}</option>${opts(o).map(([k,x])=>`<option value="${k}" ${v===k?"selected":""}>${x}</option>`).join("")}</select>`;
/* PROJETOS */
let pf={s:"",p:"",ar:0};
async function projects(){
 const [pr,tk]=await Promise.all([all("projects"),all("tasks")]);
 const l=pr.filter(p=>!!p.archived===!!pf.ar&&(!pf.s||p.status===pf.s)&&(!pf.p||p.prio===pf.p));
 V.innerHTML=TOP+`<h1>Projetos</h1><div class="sub">${pf.ar?"Arquivados":"Ativos"}</div><div class="row" style="margin-bottom:14px"><div class="row">${sel("ps",ST,pf.s,"Todos os status")}${sel("pp",PR,pf.p,"Todas as prioridades")}<button class="btn" data-a="parq">${pf.ar?"Ver ativos":"Ver arquivados"}</button></div><button class="btn p" data-a="pnew">Novo projeto</button></div>`+(l.length?`<div class="grid">${l.map(p=>{const t=tk.filter(x=>x.projectId===p.id),d=t.filter(x=>x.status==="concluida").length,pc=t.length?Math.round(d/t.length*100):p.status==="concluido"?100:0;return `<div class="card"><div class="row"><b>${esc(p.name)}</b><span><span class="tag">${ST[p.status]}</span> <span class="tag">${PR[p.prio]}</span>${p.category?` <span class="tag">${esc(p.category)}</span>`:""}</span></div><div class="lbl" style="margin:6px 0 10px">${esc(p.desc)||"Sem descrição"}${p.due?` · Prazo ${p.due}`:""} · Criado em ${new Date(p.created).toLocaleDateString("pt-BR")}</div><div class="bar"><b style="width:${pc}%"></b></div><div class="row" style="margin-top:10px"><span class="lbl">${d}/${t.length} tarefas · ${pc}%</span><span><button class='btn mini' data-a='pdet' data-id='${p.id}'>Detalhes</button> <button class="btn mini" data-a="pedit" data-id="${p.id}">Editar</button> <button class="btn mini" data-a="par" data-id="${p.id}">${p.archived?"Desarquivar":"Arquivar"}</button> <button class="btn mini" data-a="pdel" data-id="${p.id}">Excluir</button></span></div></div>`}).join("")}</div>`:empty("proj",pr.length?"Nenhum projeto com esses filtros.":"Nenhum projeto ainda. Crie o primeiro."));
}
F.ps=v=>{pf.s=v;projects()};F.pp=v=>{pf.p=v;projects()};
A.parq=()=>{pf.ar=pf.ar?0:1;projects()};
const pform=p=>modal("Projeto",[["name","Nome","text"],["desc","Descrição","area"],["category","Categoria","text"],["prio","Prioridade","select",opts(PR)],["status","Status","select",opts(ST)],["due","Prazo (opcional)","date"]],{prio:"media",status:"nao_iniciado",...p},async d=>{const o={...p,...d,id:p.id||uid(),created:p.created||Date.now()};o.completedAt=d.status==="concluido"?(p.completedAt||Date.now()):null;await put("projects",o);toast("Projeto salvo");projects()});
A.pnew=()=>pform({});A.pedit=async id=>pform((await all("projects")).find(x=>x.id===id)||{});
A.par=async id=>{const p=(await all("projects")).find(x=>x.id===id);p.archived=!p.archived;await put("projects",p);toast(p.archived?"Projeto arquivado":"Projeto restaurado");projects()};
A.pdel=id=>ask("Excluir o projeto e todas as suas tarefas? Não dá para desfazer.",async()=>{for(const t of (await all("tasks")).filter(t=>t.projectId===id))await del("tasks",t.id);await del("projects",id);toast("Projeto excluído");projects()});
/* TAREFAS */
let tf={v:"list",o:"due"};
async function tasks(){
 const [tk,pr]=await Promise.all([all("tasks"),all("projects")]),pn=Object.fromEntries(pr.map(p=>[p.id,p.name])),td=ld(),dn=t=>t.status==="concluida",po={alta:0,media:1,baixa:2};
 let l=tk.slice();if(tf.v==="today")l=l.filter(t=>t.due===td&&!dn(t));if(tf.v==="late")l=l.filter(t=>t.due&&t.due<td&&!dn(t));

const Q={run:0,end:0,start:0},U={},UB=[['start','Não sei por onde começar'],['big','É grande demais'],['boring','Está chato'],['perf','Medo de ficar ruim'],['dist','Me distraio fácil']];
const UN={start:x=>`Abrir o material de “${x}” e listar 3 passos`,big:x=>`Definir o resultado de “${x}” em 1 frase e fazer só a primeira parte (25 min)`,boring:x=>`Trabalhar 5 min em “${x}” com música ou café e depois decidir se continua`,perf:x=>`Fazer um rascunho de “${x}” em 5 min, sem revisar`,dist:x=>`Silenciar o celular, fechar abas e trabalhar 15 min só em “${x}”`};
const TEC=[['Regra dos cinco minutos','Comece e trabalhe por apenas 5 minutos. Depois decida se para. Começar é a parte mais difícil.'],['Decomposição de tarefas','Transforme algo grande em ações pequenas, concretas e com começo claro.'],['Regra dos dois minutos','Se leva menos de 2 minutos, faça agora em vez de adiar.'],['Intenção de implementação','Defina quando, onde e como: “Quando eu terminar o café, na mesa, abro o editor.”'],['Redução de atrito','Deixe tudo pronto antes: arquivos abertos, fones por perto, celular longe.'],['Trabalho monotarefa','Uma coisa por vez. Alternar entre atividades custa foco a cada troca.']];
function zap(){
 V.innerHTML=TOP+`<h1>Anti-procrastinação</h1><div class='sub'>Comece pequeno</div><div class='grid two' style='margin-bottom:12px'><div class='card'><h3>Início rápido de 5 minutos</h3><div class='big' id='q5' style='text-align:center;margin:14px 0'>${Q.run?fmt(Math.max(0,Math.round((Q.end-Date.now())/1000))):'05:00'}</div><div class='row' style='justify-content:center'>${Q.run?`<button class='btn' data-a='q5x'>Cancelar</button>`:`<button class='btn p' data-a='q5'>Começar 5 minutos</button>`}</div></div><div class='card'><h3>Destravar tarefa</h3><div class='gform'><label class='f'>O que você está adiando?<input id='ux'></label><label class='f'>O que trava você?<select id='ub'>${UB.map(([k,v])=>`<option value='${k}'>${v}</option>`).join('')}</select></label><button class='btn p' data-a='ud'>Destravar</button><div id='ur'></div></div></div></div><div class='grid' style='grid-template-columns:repeat(auto-fit,minmax(240px,1fr))'>${TEC.map(([t,d])=>`<div class='card'><b>${t}</b><div class='lbl' style='margin-top:6px'>${d}</div></div>`).join('')}</div>`;
}
A.q5=()=>{Q.start=Date.now();Q.end=Q.start+3e5;Q.run=1;zap()};A.q5x=()=>{Q.run=0;zap()};
setInterval(()=>{if(!Q.run)return;const s=Math.max(0,Math.round((Q.end-Date.now())/1000));if(s<=0){Q.run=0;put('sessions',{id:uid(),startedAt:Q.start,minutes:5,completed:true,mode:'q5',projectId:null,taskId:null});toast('5 minutos concluídos! Que tal continuar?');if(location.hash==='#zap')zap();return}const e=document.getElementById('q5');if(e)e.textContent=fmt(s)},300);
A.ud=()=>{const x=document.getElementById('ux').value.trim();if(!x)return toast('Escreva o que você está adiando');U.act=UN[document.getElementById('ub').value](x);document.getElementById('ur').innerHTML=`<div class='card' style='background:var(--sec)'><div class='lbl'>Sua ação mínima</div><div style='margin:6px 0 10px'>${esc(U.act)}</div><div class='row' style='justify-content:flex-start'><button class='btn mini p' data-a='q5'>Iniciar 5 min</button><button class='btn mini' data-a='ut'>Salvar como tarefa</button></div></div>`};
A.ut=async()=>{await put('tasks',{id:uid(),title:U.act,desc:'',projectId:'',prio:'media',due:'',status:'a_fazer',est:5,spent:0,created:Date.now()});toast('Tarefa criada')};
const VIEWS={dash:dashboard,proj:projects,task:tasks,focus,goal:habits,lib:library,zap,cfg:settings};
async function route(){const h=nav();document.getElementById("side").classList.remove("open");const f=VIEWS[h];if(f)await f();else stub(NAV.some(x=>x[0]===h)?h:"dash")}
window.addEventListener("hashchange",route);
openDB().then(()=>{applyP();if(!T.run)setPh(T.ph);route()});
</script>
</body>
